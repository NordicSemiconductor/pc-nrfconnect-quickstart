name: PR checklist

on:
  # pull_request_target runs this file from the base branch, so a PR can't
  # weaken the check by editing the workflow. It is safe here because the job
  # never checks out or runs code from the PR. Keep it that way.
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  pull-requests: read

concurrency:
  group: pr-checklist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checklist:
    name: PR checklist
    runs-on: ubuntu-latest
    steps:
      - name: Check required checklist items
        uses: actions/github-script@v7
        with:
          script: |
            // Must match .github/pull_request_template.md exactly.
            const REQUIRED = [
              'Ensure all user-facing text is spell-checked.',
              'Bump version in package.json.',
              'Update changelog.',
              'Update application feature and/or device support metadata (if applicable).',
              'Make sure Greg confirmed your PR.',
            ];
            const BYPASS_LABEL = 'checkboxes not required';

            // Fetch the live PR instead of using the event payload, so re-runs
            // see the current description and labels.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            if (pr.labels.some(l => l.name.toLowerCase() === BYPASS_LABEL)) {
              core.info(`PR has the "${BYPASS_LABEL}" label, skipping the checklist check.`);
              return;
            }

            // Text inside HTML comments or code blocks isn't rendered as a
            // checkbox, so it must not count towards the checklist.
            const body = (pr.body ?? '')
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/^(```|~~~)[\s\S]*?^\1/gm, '');

            const boxes = body
              .split(/\r?\n/)
              .map(line => line.match(/^\s*[-*+]\s+\[([ xX])\]\s+(.+?)\s*$/))
              .filter(Boolean)
              .map(([, mark, text]) => ({ checked: mark !== ' ', text }));

            const problems = [];
            for (const item of REQUIRED) {
              const matches = boxes.filter(b => b.text === item);
              if (matches.length === 0) {
                problems.push(`Missing or modified: "${item}"`);
              } else if (matches.some(b => !b.checked)) {
                problems.push(`Not checked: "${item}"`);
              }
            }

            if (problems.length > 0) {
              core.setFailed(
                'PR checklist is incomplete:\n' +
                problems.map(p => `  - ${p}`).join('\n') +
                '\n\nCheck every required box. If an item was edited or deleted, restore its original ' +
                'text from .github/pull_request_template.md. If this PR does not need the checklist, ' +
                `ask a maintainer to add the "${BYPASS_LABEL}" label.`
              );
            } else {
              core.info('All required checklist items are checked.');
            }
